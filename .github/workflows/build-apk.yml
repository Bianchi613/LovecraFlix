name: Build APK do app mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-android:
    name: Buildozer Android debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk build-essential autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            git zip unzip libltdl-dev

      - name: Instala Buildozer
        run: pip install --upgrade buildozer cython

      - name: Build com Buildozer
        working-directory: mobile
        run: buildozer -v android debug

      - name: Publica o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: lovecraflix-apk
          path: mobile/bin/*.apk
