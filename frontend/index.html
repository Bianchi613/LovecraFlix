<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LovecraFlix</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Butcherman&family=Creepster&family=Nosifer&family=Pirata+One&family=Cinzel+Decorative:wght@700&family=Orbitron:wght@700&family=Bangers&family=Luckiest+Guy&family=MedievalSharp&family=Uncial+Antiqua&family=Playfair+Display:wght@700&family=Anton&family=Oswald:wght@600&family=Bebas+Neue&family=Special+Elite&family=Black+Ops+One&family=Eater&family=Metal+Mania&family=New+Rocker&family=Rubik+Wet+Paint&family=Bungee&family=Audiowide&family=Press+Start+2P&family=Share+Tech+Mono&family=Mochiy+Pop+One&family=Fredericka+the+Great&family=Mountains+of+Christmas:wght@700&family=Pacifico&family=Fredoka:wght@600&family=Rye&family=Berkshire+Swash&family=Metamorphous&family=Sancreek&family=IM+Fell+English+SC&family=Courier+Prime:wght@700&family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <span class="logo"><img class="logo-icon" src="/static/logo.png" alt="LovecraFlix"></span>
  <input class="search-bar" type="search" id="busca" placeholder="Buscar filmes...">
  <select id="tipo-filter">
    <option value="">Tudo</option>
    <option value="filme">Filmes</option>
    <option value="serie">Séries</option>
    <option value="documentario">Documentários</option>
  </select>
  <div style="margin-left:auto;display:flex;align-items:center;gap:.75rem">
    <a href="/perfil" id="user-avatar" class="user-avatar-btn" title="Editar perfil">🐙</a>
    <span id="user-nome" style="font-size:.85rem;color:#8a7fa0"></span>
    <button onclick="logout()" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#8a7fa0;cursor:pointer;font-size:.82rem;padding:.35rem .8rem;transition:background .2s" onmouseover="this.style.background='rgba(255,255,255,.13)'" onmouseout="this.style.background='rgba(255,255,255,.07)'">Sair</button>
  </div>
</header>

<section class="hero-banner" id="hero-banner" style="display:none">
  <div id="hero-bg-wrap"></div>
  <div class="hero-banner-gradient"></div>
  <div class="hero-arrow left" onclick="mudarHero(-1)">&#8249;</div>
  <div class="hero-arrow right" onclick="mudarHero(1)">&#8250;</div>
  <div class="hero-banner-content">
    <h1 class="hero-banner-title" id="hero-title"></h1>
    <div class="hero-banner-meta" id="hero-meta"></div>
    <p class="hero-banner-synopsis" id="hero-synopsis"></p>
    <div class="hero-banner-actions">
      <button class="hero-btn hero-btn-play" id="hero-play-btn">▶ Assistir</button>
      <button class="hero-btn hero-btn-info" id="hero-info-btn">ℹ Mais Info</button>
    </div>
  </div>
  <div class="hero-banner-dots" id="hero-dots"></div>
</section>

<section class="indicacoes-section" id="indicacoes-section" style="display:none">
  <div class="indicacoes-title">Indicações para você</div>
  <div class="indicacoes-row-wrap">
    <div class="indicacoes-arrow left" onclick="scrollIndicacoes(-1)">&#8249;</div>
    <div class="indicacoes-row" id="indicacoes-row"></div>
    <div class="indicacoes-arrow right" onclick="scrollIndicacoes(1)">&#8250;</div>
  </div>
</section>

<div class="layout">
  <aside>
    <h3>Gêneros</h3>
    <button class="genre-btn active" data-genero="">Todos <span class="count" id="count-total"></span></button>
    <div id="generos-list"></div>
  </aside>

  <main>
    <div class="section-title" id="section-title">Todos os filmes</div>
    <div class="grid" id="grid"></div>
    <div class="no-results" id="no-results" style="display:none">Nenhum filme encontrado</div>
  </main>
</div>

<script>
// Verificar autenticação
const token = localStorage.getItem("lc_token");
const nome  = localStorage.getItem("lc_nome");
const avatarId = localStorage.getItem("lc_avatar") || "octopus";
if (!token) location.href = "/home";
document.getElementById("user-nome").textContent = nome ? `Olá, ${nome}` : "";

// Avatares definidos
const AVATARES_MAP = {
  octopus:"🐙",skull:"💀",eye:"👁️",ghost:"👻",bat:"🦇",moon:"🌕",
  spider:"🕷️",wolf:"🐺",alien:"👽",crystal:"🔮",fire:"🔥",snake:"🐍",
  vampire:"🧛",zombie:"🧟",witch:"🧙",demon:"😈",star:"⭐",book:"📖"
};
const BGRND_MAP = {
  octopus:"#1a0d2e",skull:"#1a0a0a",eye:"#0a1a2e",ghost:"#111128",
  bat:"#0d0d1a",moon:"#1a1500",spider:"#150a0a",wolf:"#0a0f1a",
  alien:"#001a15",crystal:"#150a2e",fire:"#1a0800",snake:"#051a05",
  vampire:"#1a0010",zombie:"#0a1a0a",witch:"#1a0d00",demon:"#1a0005",
  star:"#0a0a1a",book:"#1a1000"
};
const avEl = document.getElementById("user-avatar");
avEl.textContent = AVATARES_MAP[avatarId] || "🐙";
avEl.style.background = BGRND_MAP[avatarId] || "#1a1a2e";

function logout() {
  localStorage.removeItem("lc_token");
  localStorage.removeItem("lc_nome");
  location.href = "/login";
}

// Hero de destaques
let heroDestaques = [];
let heroIdx   = 0;
let heroTimer = null;

async function carregarHero() {
  try {
    const r = await fetch("/api/destaques");
    const data = await r.json();
    heroDestaques = data.slice(0, 6);
  } catch {
    heroDestaques = [];
  }
  if (!heroDestaques.length) return;

  const banner  = document.getElementById("hero-banner");
  const bgWrap  = document.getElementById("hero-bg-wrap");
  const dotsWrap = document.getElementById("hero-dots");
  bgWrap.innerHTML   = "";
  dotsWrap.innerHTML = "";

  heroDestaques.forEach((d, i) => {
    const bg = document.createElement("div");
    bg.className = "hero-banner-bg";
    bg.style.backgroundImage = `url("/poster?path=${encodeURIComponent(d.backdrop_hd || d.poster_hd || d.poster_local)}")`;
    bgWrap.appendChild(bg);

    const dot = document.createElement("div");
    dot.className = "hero-dot";
    dot.onclick = () => mostrarHero(i, true);
    dotsWrap.appendChild(dot);
  });

  banner.style.display = "block";
  mostrarHero(0);
  heroTimer = setInterval(() => mostrarHero((heroIdx + 1) % heroDestaques.length), 8000);

  // Recalcula o tamanho do título quando as fontes do Google Fonts terminarem de carregar
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(ajustarTituloAtual);
  }
}

// Fonte/cor do título por subgênero (prioridade) — cada subgênero da taxonomia tem a sua
const SUBGENERO_FONTE = {
  "horror cosmico":         "font-cinzel",
  "alienigenas":            "font-nosifer",
  "zumbi":                  "font-eater",
  "vampiro":                "font-metalmania",
  "possessao":              "font-newrocker",
  "slasher":                "font-wetpaint",
  "distopia":               "font-bungee",
  "espacial":               "font-audiowide",
  "viagem no tempo":        "font-pressstart",
  "inteligencia artificial":"font-sharetech",
  "anime":                  "font-mochiy",
  "musical":                "font-fredericka",
  "natal":                  "font-xmas",
  "comedia romantica":      "font-pacifico",
  "comedia adolescente":    "font-fredoka",
  "comedia negra":          "font-rye",
  "conto de fadas":         "font-berkshire",
  "espada e magia":         "font-metamorphous",
  "piratas":                "font-sancreek",
  "arqueologia":            "font-imfell",
  "baseado em fatos reais": "font-courier",
  "drama de guerra":        "font-stardos",
};

// Fonte/cor do título por gênero — usada quando não há subgênero com estilo próprio
const GENERO_FONTE = {
  "terror":            "font-creepster",
  "ficcao cientifica": "font-orbitron",
  "animacao":          "font-bangers",
  "comedia":           "font-luckiest",
  "fantasia":          "font-medieval",
  "aventura":          "font-uncial",
  "drama":             "font-playfair",
  "acao":              "font-anton",
  "documentario":      "font-oswald",
  "crime":             "font-special-elite",
  "guerra":            "font-blackops",
  "suspense":          "font-butcherman",
  "misterio":          "font-pirata",
};

// Escolhe a fonte estilizada do título: subgênero > gênero > padrão
function fonteHero(genero, subgenero) {
  const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  return SUBGENERO_FONTE[norm(subgenero)] || GENERO_FONTE[norm(genero)] || "";
}

// Calcula o tamanho de fonte do título medindo o texto real com a fonte escolhida,
// para que a maior palavra caiba na largura disponível e o título nunca seja truncado.
function calcularTamanhoTitulo(titulo, fontFamily, containerWidth) {
  const TEST = 100, MAX = 80, MIN = 26, TARGET_LINES = 2.2;
  if (!calcularTamanhoTitulo._ctx) {
    calcularTamanhoTitulo._ctx = document.createElement("canvas").getContext("2d");
  }
  const ctx = calcularTamanhoTitulo._ctx;
  ctx.font = `400 ${TEST}px ${fontFamily}`;

  let wPalavra = 0;
  titulo.trim().split(/\s+/).forEach(p => { wPalavra = Math.max(wPalavra, ctx.measureText(p).width); });
  const wTotal = ctx.measureText(titulo).width;

  const porPalavra = wPalavra ? containerWidth / wPalavra * TEST : MAX;
  const porTotal   = wTotal   ? containerWidth * TARGET_LINES / wTotal * TEST : MAX;

  return Math.round(Math.max(MIN, Math.min(MAX, porPalavra, porTotal)));
}

// Reaplica o tamanho calculado ao título atualmente exibido (ex: após as fontes carregarem)
function ajustarTituloAtual() {
  const titleEl = document.getElementById("hero-title");
  const titulo = titleEl.textContent || "";
  if (!titulo) return;
  const fontFamily = getComputedStyle(titleEl).fontFamily;
  const containerWidth = titleEl.clientWidth || 900;
  titleEl.style.fontSize = calcularTamanhoTitulo(titulo, fontFamily, containerWidth) + "px";
}

function mostrarHero(i, manual) {
  heroIdx = i;
  const d = heroDestaques[i];

  document.querySelectorAll(".hero-banner-bg").forEach((el, idx) => el.classList.toggle("active", idx === i));
  document.querySelectorAll(".hero-dot").forEach((el, idx) => el.classList.toggle("active", idx === i));

  const titleEl = document.getElementById("hero-title");
  const titulo = d.titulo_pt || "";
  titleEl.textContent = titulo;
  titleEl.className = `hero-banner-title ${fonteHero(d.genero, d.subgenero)}`;
  ajustarTituloAtual();

  document.getElementById("hero-meta").textContent     = [d.ano, d.genero].filter(Boolean).join("  ·  ");
  document.getElementById("hero-synopsis").textContent = d.sinopse || "";
  document.getElementById("hero-play-btn").onclick = () => location.href = `/player?id=${d.id}`;
  document.getElementById("hero-info-btn").onclick = () => location.href = `/filme?titulo=${encodeURIComponent(d.titulo_pt)}`;

  if (manual) {
    clearInterval(heroTimer);
    heroTimer = setInterval(() => mostrarHero((heroIdx + 1) % heroDestaques.length), 8000);
  }
}

function mudarHero(delta) {
  const len = heroDestaques.length;
  if (!len) return;
  mostrarHero((heroIdx + delta + len) % len, true);
}

// Indicações (ranking numerado)
async function carregarIndicacoes() {
  try {
    const r = await fetch("/api/indicacoes", { headers: { "Authorization": `Bearer ${token}` } });
    const data = await r.json();
    if (!data.length) return;

    const row = document.getElementById("indicacoes-row");
    row.innerHTML = "";
    data.forEach((f, i) => {
      const item = document.createElement("div");
      item.className = "indicacao-item";
      item.onclick = () => location.href = `/player?id=${f.id}`;

      const posterSrc = f.poster_hd || f.poster_local;
      const posterHtml = posterSrc
        ? `<img class="card-poster" src="/poster?path=${encodeURIComponent(posterSrc)}"
               alt="${f.titulo_pt || f.titulo}" loading="lazy"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : "";
      const fallback = `<div class="card-poster-fallback" ${posterSrc ? 'style="display:none"' : ""}>🎬</div>`;

      item.innerHTML = `
        <div class="indicacao-numero">${i + 1}</div>
        <div class="card indicacao-card">
          ${posterHtml}${fallback}
          <div class="card-info">
            <div class="card-title">${f.titulo_pt || f.titulo || "Sem título"}</div>
            <div class="card-year">${f.ano || ""} · ${f.genero || ""}</div>
          </div>
        </div>`;
      row.appendChild(item);
    });
    document.getElementById("indicacoes-section").style.display = "block";
  } catch {}
}

function scrollIndicacoes(dir) {
  const row = document.getElementById("indicacoes-row");
  row.scrollBy({ left: dir * row.clientWidth * 0.8, behavior: "smooth" });
}

carregarHero();
carregarIndicacoes();
</script>
<script src="/static/app.js"></script>
</body>
</html>
