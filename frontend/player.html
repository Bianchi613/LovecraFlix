<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LovecraFlix — Player</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* ── Overlay de fim ── */
    .end-overlay {
      display: none; position: absolute; inset: 0; z-index: 20;
      background: rgba(5,5,12,0.92);
      align-items: center; justify-content: center;
      flex-direction: column; text-align: center; padding: 2rem;
    }
    .end-overlay.show { display: flex; }

    /* Auto-play próximo episódio */
    .autoplay-box {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px; padding: 1.75rem 2.5rem;
      max-width: 420px; width: 100%;
    }
    .autoplay-box .ap-label { color: var(--muted); font-size: .82rem; margin-bottom: .4rem; }
    .autoplay-box .ap-titulo { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.25rem; }
    .ap-counter {
      font-size: 2.2rem; font-weight: 900; color: var(--accent);
      margin-bottom: 1rem; font-variant-numeric: tabular-nums;
    }
    .ap-actions { display: flex; gap: .75rem; justify-content: center; }
    .ap-btn {
      border: none; border-radius: 8px; cursor: pointer;
      font-size: .9rem; font-weight: 600; padding: .6rem 1.4rem;
      transition: opacity .2s;
    }
    .ap-btn:hover { opacity: .85; }
    .ap-btn.primary { background: var(--accent); color: #fff; }
    .ap-btn.secondary {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15); color: var(--text);
    }

    /* Recomendações */
    .rec-box { max-width: 800px; width: 100%; }
    .rec-box h2 { font-size: 1.1rem; color: var(--muted); margin-bottom: 1.25rem; }
    .rec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: .85rem;
    }
    .rec-card {
      cursor: pointer; border-radius: 8px; overflow: hidden;
      position: relative;
      transition: transform .2s, box-shadow .2s;
    }
    .rec-card:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 12px 30px rgba(100,30,120,.5); }
    .rec-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
    .rec-card .rc-fallback {
      width: 100%; aspect-ratio: 2/3;
      background: linear-gradient(160deg,#2a1f3d,#0a0a0f);
      display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
    }
    .rec-card .rc-info {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(5,5,12,.95), transparent);
      padding: 1.5rem .5rem .45rem;
      font-size: .72rem; font-weight: 600; color: #f0eaff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rec-back-btn {
      margin-top: 1.5rem; background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.15); border-radius: 8px;
      color: var(--text); cursor: pointer; font-size: .9rem;
      padding: .6rem 1.5rem; transition: background .2s;
    }
    .rec-back-btn:hover { background: rgba(255,255,255,.13); }

    /* ── Spinner de loading/buffering ── */
    .player-loading {
      display: none; position: absolute; inset: 0; z-index: 12;
      align-items: center; justify-content: center;
      background: rgba(5,5,12,.35); pointer-events: none;
    }
    .player-loading.show { display: flex; }
    .spinner {
      width: 48px; height: 48px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,.2);
      border-top-color: var(--accent);
      animation: cc-spin .8s linear infinite;
    }
    @keyframes cc-spin { to { transform: rotate(360deg); } }

    /* ── Barra de controles customizada ── */
    .player-wrap.cc-hide-cursor { cursor: none; }

    .custom-controls {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 15;
      padding: 1.5rem 1rem .6rem;
      background: linear-gradient(to top, rgba(5,5,12,.92) 0%, rgba(5,5,12,.55) 55%, transparent 100%);
      opacity: 0; transform: translateY(8px); pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
    }
    .player-wrap:hover .custom-controls,
    .custom-controls.cc-visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .custom-controls.cc-force-hide { opacity: 0 !important; pointer-events: none !important; }

    /* Linha de progresso */
    .cc-progress-row { display: flex; align-items: center; gap: .6rem; margin-bottom: .35rem; }
    .cc-time {
      font-size: .78rem; color: var(--text);
      font-variant-numeric: tabular-nums;
      min-width: 4.2em; text-align: center; flex-shrink: 0;
    }
    .cc-progress-track {
      position: relative; flex: 1; height: 5px;
      background: rgba(255,255,255,.18); border-radius: 3px; cursor: pointer;
      transition: height .12s ease;
    }
    .cc-progress-track:hover, .cc-progress-track.cc-dragging { height: 8px; }
    .cc-progress-buffered, .cc-progress-filled {
      position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; width: 0%;
    }
    .cc-progress-buffered { background: rgba(255,255,255,.3); }
    .cc-progress-filled { background: var(--accent); }
    .cc-progress-handle {
      position: absolute; top: 50%; left: 0%;
      width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
      transform: translate(-50%, -50%) scale(0);
      transition: transform .12s ease;
      box-shadow: 0 0 6px rgba(123,45,139,.8);
    }
    .cc-progress-track:hover .cc-progress-handle,
    .cc-progress-track.cc-dragging .cc-progress-handle { transform: translate(-50%, -50%) scale(1); }

    /* Linha de botões */
    .cc-buttons-row { display: flex; align-items: center; justify-content: space-between; gap: .25rem; }
    .cc-group { display: flex; align-items: center; gap: .15rem; }
    .cc-btn {
      background: none; border: none; cursor: pointer; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; border-radius: 6px; position: relative;
      transition: background .15s, color .15s;
    }
    .cc-btn:hover { background: rgba(255,255,255,.12); color: #fff; }
    .cc-btn.active { color: var(--accent); }
    .cc-icon { font-size: 1.15rem; line-height: 1; }
    .cc-icon svg { width: 22px; height: 22px; display: block; fill: currentColor; }

    .cc-cc-icon {
      font-size: .72rem; font-weight: 800;
      border: 1.5px solid currentColor; border-radius: 3px; padding: 1px 3px; line-height: 1.1;
    }
    #cc-subtitles.active .cc-cc-icon { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Volume */
    .cc-volume-group {
      display: flex; align-items: center; overflow: hidden;
      max-width: 38px; transition: max-width .25s ease;
    }
    .cc-volume-group:hover, .cc-volume-group.cc-active { max-width: 140px; }
    .cc-volume-slider {
      width: 90px; margin-left: .4rem; accent-color: var(--accent);
      height: 4px; cursor: pointer;
    }

    /* Menu de configurações */
    .cc-settings-wrap { position: relative; }
    .cc-settings-menu {
      display: none; position: absolute; bottom: calc(100% + 8px); right: 0;
      background: rgba(17,17,24,.97); border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px; padding: .4rem; min-width: 180px; max-height: 260px;
      overflow-y: auto; font-size: .85rem; box-shadow: 0 8px 24px rgba(0,0,0,.6);
    }
    .cc-settings-menu.show { display: block; }
    .cc-settings-section { padding: .3rem .5rem; }
    .cc-settings-section + .cc-settings-section {
      border-top: 1px solid rgba(255,255,255,.08); margin-top: .25rem;
    }
    .cc-settings-label {
      font-size: .7rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: .35rem;
    }
    .cc-settings-option {
      display: flex; justify-content: space-between; align-items: center;
      padding: .35rem .5rem; border-radius: 5px; cursor: pointer;
      transition: background .12s;
    }
    .cc-settings-option:hover { background: rgba(255,255,255,.08); }
    .cc-settings-option.active { color: var(--accent); font-weight: 700; }

    /* Fullscreen */
    .player-wrap:fullscreen, .player-wrap:-webkit-full-screen { width: 100vw; height: 100vh; }
    .player-wrap:fullscreen video, .player-wrap:-webkit-full-screen video {
      max-height: 100vh; height: 100%;
    }
    .player-wrap:fullscreen .custom-controls,
    .player-wrap:-webkit-full-screen .custom-controls { padding: 0 2rem 1.2rem; }

    /* Responsivo */
    @media (max-width: 640px) {
      .custom-controls { padding: 0 .5rem .5rem; }
      .cc-btn { width: 32px; height: 32px; }
      .cc-icon { font-size: 1rem; }
      .cc-icon svg { width: 18px; height: 18px; }
      .cc-time { font-size: .68rem; min-width: 3.6em; }
      #cc-restart { display: none; }
      .cc-volume-group { display: none; }
      .cc-settings-menu { min-width: 160px; font-size: .8rem; }
    }
  </style>
</head>
<script>if (!localStorage.getItem("lc_token")) location.href = "/home";</script>
<body>

<div class="player-wrap" id="player-wrap">
  <button class="player-back back-btn" onclick="history.back()">← Voltar</button>
  <video id="player" preload="metadata"></video>

  <!-- Spinner de buffering/loading -->
  <div class="player-loading" id="player-loading"><div class="spinner"></div></div>

  <!-- Barra de controles customizada -->
  <div class="custom-controls" id="custom-controls">
    <div class="cc-progress-row">
      <span class="cc-time" id="cc-current-time">00:00:00</span>
      <div class="cc-progress-track" id="cc-progress-track">
        <div class="cc-progress-buffered" id="cc-progress-buffered"></div>
        <div class="cc-progress-filled" id="cc-progress-filled"></div>
        <div class="cc-progress-handle" id="cc-progress-handle"></div>
      </div>
      <span class="cc-time" id="cc-duration">00:00:00</span>
    </div>

    <div class="cc-buttons-row">
      <div class="cc-group cc-group-left">
        <button class="cc-btn" id="cc-play-pause" title="Play/Pause" aria-label="Play/Pause">
          <span class="cc-icon">▶</span>
        </button>
        <button class="cc-btn" id="cc-restart" title="Reiniciar" aria-label="Reiniciar do início">
          <span class="cc-icon">↺</span>
        </button>
        <button class="cc-btn" id="cc-back10" title="Voltar 10s" aria-label="Voltar 10 segundos">
          <span class="cc-icon">
            <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
              <text x="12" y="17" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor">10</text>
            </svg>
          </span>
        </button>
        <button class="cc-btn" id="cc-fwd10" title="Avançar 10s" aria-label="Avançar 10 segundos">
          <span class="cc-icon">
            <svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
              <text x="12" y="17" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor" style="transform:scaleX(-1)" transform-origin="12 14">10</text>
            </svg>
          </span>
        </button>
        <div class="cc-volume-group" id="cc-volume-group">
          <button class="cc-btn" id="cc-mute" title="Mudo" aria-label="Ativar/desativar volume">
            <span class="cc-icon" id="cc-volume-icon">🔊</span>
          </button>
          <input type="range" class="cc-volume-slider" id="cc-volume-slider" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        </div>
      </div>

      <div class="cc-group cc-group-right">
        <button class="cc-btn" id="cc-subtitles" title="Legendas" aria-label="Alternar legendas" style="display:none">
          <span class="cc-icon cc-cc-icon">CC</span>
        </button>
        <div class="cc-settings-wrap">
          <button class="cc-btn" id="cc-settings" title="Configurações" aria-label="Configurações">
            <span class="cc-icon">⚙</span>
          </button>
          <div class="cc-settings-menu" id="cc-settings-menu"></div>
        </div>
        <button class="cc-btn" id="cc-pip" title="Picture-in-Picture" aria-label="Picture-in-Picture">
          <span class="cc-icon">⧉</span>
        </button>
        <button class="cc-btn" id="cc-fullscreen" title="Tela cheia" aria-label="Tela cheia">
          <span class="cc-icon">⛶</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Overlay fim de episódio (auto-play) -->
  <div class="end-overlay" id="overlay-autoplay">
    <div class="autoplay-box">
      <div class="ap-label">Próximo episódio em</div>
      <div class="ap-counter" id="ap-counter">10</div>
      <div class="ap-titulo" id="ap-titulo"></div>
      <div class="ap-actions">
        <button class="ap-btn primary" onclick="irProximo()">▶ Assistir agora</button>
        <button class="ap-btn secondary" onclick="cancelarAutoplay()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Overlay fim de conteúdo (recomendações) -->
  <div class="end-overlay" id="overlay-rec">
    <div class="rec-box">
      <h2>O que assistir agora?</h2>
      <div class="rec-grid" id="rec-grid"></div>
      <button class="rec-back-btn" onclick="history.back()">← Voltar ao catálogo</button>
    </div>
  </div>
</div>

<div class="player-info" id="player-info"></div>
<div class="player-info" style="padding-top:0" id="stars-container"></div>

<script>
const params     = new URLSearchParams(location.search);
const filmeId    = parseInt(params.get("id"));
const nextId     = params.get("next_id") ? parseInt(params.get("next_id")) : null;
const nextTitulo = params.get("next_titulo") || "Próximo episódio";
const autoplay   = params.get("autoplay") === "1";

let audioAtual    = 0;   // faixa de áudio activa
let arquivoAtual  = "";
let needsTranscode = false;

function trocarAudio(faixa) {
  audioAtual = faixa;
  const video    = document.getElementById("player");
  const tempo    = video.currentTime;
  const pausado  = video.paused;

  // Força transcodificação com a faixa escolhida
  video.src = `/transcode?path=${encodeURIComponent(arquivoAtual)}&audio_track=${faixa}`;
  video.load();
  video.addEventListener("canplay", () => {
    video.currentTime = tempo;
    if (!pausado) video.play();
  }, { once: true });

  // Atualiza visual das opções no menu de configurações
  document.querySelectorAll("#cc-settings-menu [data-audio]").forEach(b => {
    b.classList.toggle("active", parseInt(b.dataset.audio) === faixa);
  });
}

let countdownTimer = null;
let countdownVal   = 10;

function irProximo() {
  clearInterval(countdownTimer);
  location.href = `/player?id=${nextId}&autoplay=1`;
}

function cancelarAutoplay() {
  clearInterval(countdownTimer);
  document.getElementById("overlay-autoplay").classList.remove("show");
  document.getElementById("custom-controls").classList.remove("cc-force-hide");
  document.getElementById("player").play();
}

function iniciarAutoplay() {
  const overlay = document.getElementById("overlay-autoplay");
  document.getElementById("custom-controls").classList.add("cc-force-hide");
  document.getElementById("ap-titulo").textContent = decodeURIComponent(nextTitulo);
  overlay.classList.add("show");
  countdownVal = 10;
  document.getElementById("ap-counter").textContent = countdownVal;
  countdownTimer = setInterval(() => {
    countdownVal--;
    document.getElementById("ap-counter").textContent = countdownVal;
    if (countdownVal <= 0) irProximo();
  }, 1000);
}

async function mostrarRecomendacoes() {
  document.getElementById("custom-controls").classList.add("cc-force-hide");
  const token = localStorage.getItem("lc_token");
  const r    = await fetch(`/api/recomendacoes?id=${filmeId}`,
    { headers: { Authorization: `Bearer ${token}` } });
  const recs = await r.json();
  const grid = document.getElementById("rec-grid");
  grid.innerHTML = "";
  recs.forEach(f => {
    const card = document.createElement("div");
    card.className = "rec-card";
    card.onclick   = () => location.href = `/player?id=${f.id}`;
    const poster = f.poster_local
      ? `<img src="/poster?path=${encodeURIComponent(f.poster_local)}" loading="lazy">`
      : `<div class="rc-fallback">🎬</div>`;
    card.innerHTML = `${poster}<div class="rc-info">${f.titulo_pt || ""}</div>`;
    grid.appendChild(card);
  });
  document.getElementById("overlay-rec").classList.add("show");
}

async function load() {
  if (!filmeId) return;

  const rFilme = await fetch(`/api/filmes/${filmeId}`);
  const f = await rFilme.json();

  document.title = `${f.titulo_pt || f.titulo} — LovecraFlix`;

  const video = document.getElementById("player");
  if (f.poster_local) video.poster = `/poster?path=${encodeURIComponent(f.poster_local)}`;

  arquivoAtual   = f.arquivo_novo || "";
  needsTranscode = f.needs_transcode;

  if (f.arquivo_novo) {
    const transcodeSrc = `/transcode?path=${encodeURIComponent(f.arquivo_novo)}&audio_track=0`;
    const directSrc    = `/video?path=${encodeURIComponent(f.arquivo_novo)}`;
    video.src = f.needs_transcode ? transcodeSrc : directSrc;

    video.addEventListener("error", () => {
      if (video.src !== transcodeSrc) { video.src = transcodeSrc; video.load(); video.play(); }
    });

    if (autoplay) {
      video.addEventListener("canplay", () => video.play(), { once: true });
    }

    if (f.tem_legenda) {
      const stem  = f.arquivo_novo.substring(0, f.arquivo_novo.lastIndexOf("."));
      const track = document.createElement("track");
      track.kind = "subtitles"; track.srclang = "pt";
      track.label = "Português"; track.default = true;
      track.src = `/subtitle?path=${encodeURIComponent(stem + ".srt")}`;
      video.appendChild(track);
    }

    // Fim do vídeo
    video.addEventListener("ended", () => {
      if (nextId) {
        iniciarAutoplay();
      } else {
        mostrarRecomendacoes();
      }
    });
  }

  const horrorBadge = f.subgenero === "Horror Cosmico"
    ? `<span class="tag horror">🐙 Horror Cósmico</span>` : "";
  const legBadge = f.tem_legenda ? `<span class="tag">📝 Legenda</span>` : "";

  // Para séries: extrai número e título do episódio a partir do nome do arquivo
  let epLabel = "";
  let epTitulo = "";
  if (f.tipo === "serie" && f.arquivo_novo) {
    const fname = f.arquivo_novo.replace(/\\/g, "/").split("/").pop().replace(/\.[^.]+$/, "");
    const mSE = fname.match(/[Ss](\d+)[Ee](\d+)/);
    const mNum = fname.match(/^(\d+)\s*[-–]\s*(.+)/);
    if (mSE) {
      epLabel  = `T${mSE[1]} · E${mSE[2].padStart(2,"0")}`;
      // Nome após o SxxExx se existir
      const resto = fname.replace(/.*[Ss]\d+[Ee]\d+[-.\s]*/, "").trim();
      epTitulo = resto || fname;
    } else if (mNum) {
      epLabel  = `Ep. ${mNum[1]}`;
      epTitulo = mNum[2].trim();
    } else {
      epTitulo = fname;
    }
  }

  const tituloSerie  = f.tipo === "serie" ? `<div class="player-serie-nome">${f.titulo_pt || f.titulo}</div>` : "";
  const tituloPrincipal = f.tipo === "serie"
    ? (epLabel ? `${epLabel} — ${epTitulo}` : epTitulo || f.titulo_pt)
    : (f.titulo_pt || f.titulo || "Sem título");

  document.getElementById("player-info").innerHTML = `
    <div class="player-title-row">
      <div>
        ${tituloSerie}
        <h1>${tituloPrincipal}</h1>
        ${f.tipo !== "serie" && f.titulo_original && f.titulo_original !== f.titulo_pt
          ? `<div class="player-original">${f.titulo_original}</div>` : ""}
      </div>
    </div>
    <div class="meta-row" style="margin-bottom:1.25rem">
      ${f.ano    ? `<span class="tag">${f.ano}</span>`    : ""}
      ${f.genero ? `<span class="tag">${f.genero}</span>` : ""}
      ${f.idioma ? `<span class="tag">${f.idioma}</span>` : ""}
      ${horrorBadge}${legBadge}
      ${f.tmdb_url ? `<a href="${f.tmdb_url}" target="_blank" class="tmdb-link">TMDB ↗</a>` : ""}
    </div>
    ${f.sinopse ? `<p class="player-synopsis">${f.sinopse}</p>` : ""}
  `;

  // Configura legendas (CC) e menu de configurações
  setupSubtitlesToggle();
  montarMenuConfiguracoes(f);

  // Carrega avaliação do usuário
  carregarEstrelas(filmeId);
}

async function carregarEstrelas(fid) {
  const token = localStorage.getItem("lc_token");
  const [rNota, rMedia] = await Promise.all([
    fetch(`/api/avaliacao?filme_id=${fid}`, { headers: { Authorization: `Bearer ${token}` } }),
    fetch(`/api/avaliacoes/media?filme_id=${fid}`)
  ]);
  const { nota }  = await rNota.json();
  const { media, total } = await rMedia.json();

  const container = document.getElementById("stars-container");
  container.innerHTML = `
    <div class="stars-widget">
      <span class="stars-label">Sua avaliação:</span>
      <div class="stars" id="stars">
        ${[1,2,3,4,5].map(n =>
          `<span class="star ${n <= nota ? 'filled' : ''}" data-val="${n}">★</span>`
        ).join("")}
      </div>
      ${total > 0 ? `<span class="stars-media">Média: ${media}★ (${total})</span>` : ""}
      <span class="stars-saved" id="stars-saved">✓ Salvo</span>
    </div>`;

  const stars = document.querySelectorAll(".star");
  let notaAtual = nota;

  stars.forEach(s => {
    const val = parseInt(s.dataset.val);
    s.addEventListener("mouseenter", () => {
      stars.forEach(x => {
        x.className = "star" + (parseInt(x.dataset.val) <= val ? " hover-on" : "");
      });
    });
    s.addEventListener("mouseleave", () => {
      stars.forEach(x => {
        x.className = "star" + (parseInt(x.dataset.val) <= notaAtual ? " filled" : "");
      });
    });
    s.addEventListener("click", async () => {
      notaAtual = val;
      stars.forEach(x => {
        x.className = "star" + (parseInt(x.dataset.val) <= val ? " filled" : "");
      });
      await fetch("/api/avaliar", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ filme_id: fid, nota: val })
      });
      const saved = document.getElementById("stars-saved");
      saved.classList.add("show");
      setTimeout(() => saved.classList.remove("show"), 2000);
    });
  });
}

// ── Barra de controles customizada ──────────────────────────────────────────

function formatTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) seconds = 0;
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  return [h, m, s].map(v => String(v).padStart(2, "0")).join(":");
}

function setupPlayPause() {
  const video = document.getElementById("player");
  const btn   = document.getElementById("cc-play-pause");

  const updateIcon = () => {
    btn.querySelector(".cc-icon").textContent = video.paused ? "▶" : "⏸";
  };
  btn.addEventListener("click", () => video.paused ? video.play() : video.pause());
  video.addEventListener("play", updateIcon);
  video.addEventListener("pause", updateIcon);
  video.addEventListener("click", () => video.paused ? video.play() : video.pause());
}

function setupSkipButtons() {
  const video = document.getElementById("player");
  document.getElementById("cc-restart").addEventListener("click", () => {
    video.currentTime = 0;
    if (video.paused) video.play();
  });
  document.getElementById("cc-back10").addEventListener("click", () => {
    video.currentTime = Math.max(0, video.currentTime - 10);
  });
  document.getElementById("cc-fwd10").addEventListener("click", () => {
    video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 10);
  });
}

function setupProgressBar() {
  const video    = document.getElementById("player");
  const track    = document.getElementById("cc-progress-track");
  const filled   = document.getElementById("cc-progress-filled");
  const buffered = document.getElementById("cc-progress-buffered");
  const handle   = document.getElementById("cc-progress-handle");
  const curEl    = document.getElementById("cc-current-time");
  const durEl    = document.getElementById("cc-duration");

  let dragging = false;

  const updateUI = () => {
    const dur = video.duration || 0;
    const pct = dur ? (video.currentTime / dur) * 100 : 0;
    filled.style.width = pct + "%";
    handle.style.left  = pct + "%";
    curEl.textContent  = formatTime(video.currentTime);
    if (dur) durEl.textContent = formatTime(dur);

    if (video.buffered.length) {
      const end = video.buffered.end(video.buffered.length - 1);
      buffered.style.width = (dur ? (end / dur) * 100 : 0) + "%";
    }
  };

  video.addEventListener("timeupdate", () => { if (!dragging) updateUI(); });
  video.addEventListener("loadedmetadata", updateUI);
  video.addEventListener("progress", updateUI);

  const seekFromEvent = (clientX) => {
    const rect = track.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    return ratio * (video.duration || 0);
  };

  track.addEventListener("pointerdown", (e) => {
    dragging = true;
    track.classList.add("cc-dragging");
    const t = seekFromEvent(e.clientX);
    const pct = (t / (video.duration || 1)) * 100;
    filled.style.width = pct + "%";
    handle.style.left  = pct + "%";
    curEl.textContent = formatTime(t);
    track.setPointerCapture(e.pointerId);
  });
  track.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const t = seekFromEvent(e.clientX);
    const pct = (t / (video.duration || 1)) * 100;
    filled.style.width = pct + "%";
    handle.style.left  = pct + "%";
    curEl.textContent = formatTime(t);
  });
  const endDrag = (e) => {
    if (!dragging) return;
    dragging = false;
    track.classList.remove("cc-dragging");
    video.currentTime = seekFromEvent(e.clientX);
  };
  track.addEventListener("pointerup", endDrag);
  track.addEventListener("pointercancel", endDrag);
}

function setupVolume() {
  const video   = document.getElementById("player");
  const muteBtn = document.getElementById("cc-mute");
  const slider  = document.getElementById("cc-volume-slider");
  const group   = document.getElementById("cc-volume-group");
  const icon    = document.getElementById("cc-volume-icon");

  const updateIcon = () => {
    icon.textContent = video.muted || video.volume === 0 ? "🔇"
      : video.volume < 0.5 ? "🔉" : "🔊";
  };

  slider.addEventListener("input", () => {
    video.volume = parseFloat(slider.value);
    video.muted  = video.volume === 0;
    updateIcon();
  });

  muteBtn.addEventListener("click", () => {
    video.muted = !video.muted;
    if (!video.muted && video.volume === 0) { video.volume = 1; slider.value = 1; }
    updateIcon();
    if (window.matchMedia("(hover: none)").matches) {
      group.classList.toggle("cc-active");
    }
  });

  updateIcon();
}

function setupSubtitlesToggle() {
  const video = document.getElementById("player");
  const btn   = document.getElementById("cc-subtitles");

  if (video.textTracks.length === 0) { btn.style.display = "none"; return; }

  btn.style.display = "flex";
  const track = video.textTracks[0];
  track.mode = "showing";
  btn.classList.add("active");

  btn.onclick = () => {
    const showing = track.mode === "showing";
    track.mode = showing ? "hidden" : "showing";
    btn.classList.toggle("active", !showing);
  };
}

function montarMenuConfiguracoes(f) {
  const menu = document.getElementById("cc-settings-menu");
  const isDual = (f.idioma || "").toLowerCase().includes("dual");
  const video = document.getElementById("player");

  menu.innerHTML = `
    <div class="cc-settings-section">
      <div class="cc-settings-label">Velocidade</div>
      ${[0.5, 0.75, 1, 1.25, 1.5, 2].map(r => `
        <div class="cc-settings-option ${r === 1 ? 'active' : ''}" data-speed="${r}">
          <span>${r === 1 ? "Normal" : r + "x"}</span>
        </div>`).join("")}
    </div>
    ${isDual ? `
    <div class="cc-settings-section">
      <div class="cc-settings-label">Áudio</div>
      <div class="cc-settings-option active" data-audio="0">
        <span>🇧🇷 Português</span>
      </div>
      <div class="cc-settings-option" data-audio="1">
        <span>🇬🇧 Original</span>
      </div>
    </div>` : ""}
  `;

  menu.querySelectorAll("[data-speed]").forEach(opt => {
    opt.addEventListener("click", () => {
      video.playbackRate = parseFloat(opt.dataset.speed);
      menu.querySelectorAll("[data-speed]").forEach(o => o.classList.remove("active"));
      opt.classList.add("active");
    });
  });

  menu.querySelectorAll("[data-audio]").forEach(opt => {
    opt.addEventListener("click", () => {
      trocarAudio(parseInt(opt.dataset.audio));
    });
  });
}

function setupSettingsMenu() {
  const btn  = document.getElementById("cc-settings");
  const menu = document.getElementById("cc-settings-menu");
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    menu.classList.toggle("show");
  });
  document.addEventListener("click", (e) => {
    if (!menu.contains(e.target) && e.target !== btn) menu.classList.remove("show");
  });
}

function setupPip() {
  const video = document.getElementById("player");
  const btn   = document.getElementById("cc-pip");

  if (!document.pictureInPictureEnabled) {
    btn.style.display = "none";
    return;
  }

  btn.addEventListener("click", async () => {
    try {
      if (document.pictureInPictureElement) {
        await document.exitPictureInPicture();
      } else {
        await video.requestPictureInPicture();
      }
    } catch (err) {
      console.warn("PiP indisponível:", err);
    }
  });

  video.addEventListener("enterpictureinpicture", () => btn.classList.add("active"));
  video.addEventListener("leavepictureinpicture", () => btn.classList.remove("active"));
}

function setupFullscreen() {
  const wrap = document.getElementById("player-wrap");
  const btn  = document.getElementById("cc-fullscreen");

  const requestFs = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
  if (!requestFs) { btn.style.display = "none"; return; }

  btn.addEventListener("click", () => {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFs) {
      requestFs.call(wrap);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  });

  const updateState = () => {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    btn.classList.toggle("active", !!isFs);
  };
  document.addEventListener("fullscreenchange", updateState);
  document.addEventListener("webkitfullscreenchange", updateState);
}

function setupAutoHide() {
  const wrap  = document.getElementById("player-wrap");
  const video = document.getElementById("player");
  const cc    = document.getElementById("custom-controls");

  let hideTimer = null;

  const show = () => {
    cc.classList.add("cc-visible");
    wrap.classList.remove("cc-hide-cursor");
    clearTimeout(hideTimer);
    if (!video.paused) {
      hideTimer = setTimeout(() => {
        cc.classList.remove("cc-visible");
        wrap.classList.add("cc-hide-cursor");
        document.getElementById("cc-settings-menu").classList.remove("show");
      }, 3000);
    }
  };

  wrap.addEventListener("mousemove", show);
  wrap.addEventListener("mouseenter", show);
  wrap.addEventListener("click", show);
  wrap.addEventListener("touchstart", show);

  video.addEventListener("pause", () => { clearTimeout(hideTimer); show(); });
  video.addEventListener("play", show);

  show();
}

function setupLoadingSpinner() {
  const video   = document.getElementById("player");
  const loading = document.getElementById("player-loading");

  video.addEventListener("waiting", () => loading.classList.add("show"));
  video.addEventListener("seeking", () => loading.classList.add("show"));
  video.addEventListener("playing", () => loading.classList.remove("show"));
  video.addEventListener("canplay", () => loading.classList.remove("show"));
  video.addEventListener("seeked", () => loading.classList.remove("show"));
}

function initCustomControls() {
  setupPlayPause();
  setupSkipButtons();
  setupProgressBar();
  setupVolume();
  setupSettingsMenu();
  setupPip();
  setupFullscreen();
  setupAutoHide();
  setupLoadingSpinner();
}

initCustomControls();
load();
</script>
